name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workflow action pins
        run: npm run check:actions

      - name: Typecheck against pinned Pi dependencies
        run: npm run typecheck

      - name: Load extension with Pi's jiti runtime
        run: npm run test:pi-contract

      - name: Check script syntax
        run: npm run check

      - name: Show package dry-run contents
        run: npm run pack:dry-run

      - name: Guard package contents
        run: npm run check:pack

      - name: Run release validation script
        run: npm run validate
